<!DOCTYPE html>
<html lang= "en">

<head> 
    <meta charset= "UTF-8"> <!--Tells the web browser how to translate machine code into readable text for an HTML document-->

    <meta name= "viewport" content="width=device-width, initial-scale=1.0>" 
    <title>TinkerTick</title>


    <style>
        * { 
            box-sizing: border-box; 
        }



        body { 
            margin: 0;
            background-color: #121018;
            color: #e0d0b0;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }



        header {
            background: #1b1624;
            border-bottom: 2px solid #5a4221;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }



        h1 {  /* Styles the main 'TinkerTick' heading inside the header */ 
            margin: 0; 
            font-size: 1.15rem;
            font-weight: 600;
            color: #d4a359
        }


        .status {  /* Styles the 'Status: Ready' container on the right side of the header */
            font-size: 0.9rem;
        }

        .status-ok {  /* Styles the word 'Ready' */
            color: #6bbe6b;
            font-weight: 600;
        }


        .workspace {   /* Styles the main middle area below the header */
            display: flex; 
            flex: 1;
        }



        .editor-panel {  /* Styles the left panel where we type code*/
            width: 35%;
            background: #181522;
            border-right: 2px solid #3d2d18;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }


        .editoral-panel h3 {  /* Styles the 'Source Code' sub-heading inside the left panel */
            margin: 0 0 6 px;
            font-size: 1rem;
        }


        .editoral-hint {   /* Styles the small helper sentence under 'Source Code */
            margin: 0 0 12px;
            font-size: 0.85rem;
            color: #a09070;
        }



        .code-input {   /* Styles the code where we paste the code */
            width: 100%;
            flex: 1;
            resize: none;
            background: #0f0d14;
            color: #e0d0b0;
            border: 1px solid #3d2d18;
            padding: 12px; 
            font-family:'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }


        .code-input:focus {  /* changes how the code box looks when we click inside it to type */
            outline: none;
            border-color: #d4a359;
        }



        .canvas-panel {  /* styles the right-hand area holding the spinning gear canvas */
            flex: 1;
            background: radial-gradient( circle, #221c2e 0%, #121018 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }


        canvas { /* styles the square drawing board where the gear spins */
            border: 2px solid #5a4221;
            background: #0d0b10;
            box-shadow: 0 0 20px rgba(212, 163, 89, 0.15);
        }
    </style>

    </head>
