<!DOCTYPE html>
<html lang= "en">

<head> 
    <meta charset= "UTF-8"> <!--Tells the web browser how to translate machine code into readable text for an HTML document-->

    <meta name= "viewport" content="width=device-width, initial-scale=1.0">
    <title>TinkerTick</title>


    <style>
        * { 
            box-sizing: border-box; 
        }



        body { 
            margin: 0;
            background-color: #121018;
            color: #e0d0b0;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }



        header {
            background: #1b1624;
            border-bottom: 2px solid #5a4221;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }



        h1 {  /* Styles the main 'TinkerTick' heading inside the header */ 
            margin: 0; 
            font-size: 1.15rem;
            font-weight: 600;
            color: #d4a359
        }


        .status {  /* Styles the 'Status: Ready' container on the right side of the header */
            font-size: 0.9rem;
        }

        .status-ok {  /* Styles the word 'Ready' */
            color: #6bbe6b;
            font-weight: 600;
        }


        .workspace {   /* Styles the main middle area below the header */
            display: flex; 
            flex: 1;
        }



        .editor-panel {  /* Styles the left panel where we type code*/
            width: 35%;
            background: #181522;
            border-right: 2px solid #3d2d18;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }


        .editor-panel h3 {  /* Styles the 'Source Code' sub-heading inside the left panel */
            margin: 0 0 6px;
            font-size: 1rem;
        }


        .editor-hint {   /* Styles the small helper sentence under 'Source Code */
            margin: 0 0 12px;
            font-size: 0.85rem;
            color: #a09070;
        }



        .code-input {   /* Styles the code where we paste the code */
            width: 100%;
            flex: 1;
            resize: none;
            background: #0f0d14;
            color: #e0d0b0;
            border: 1px solid #3d2d18;
            padding: 12px; 
            font-family:'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }


        .code-input:focus {  /* changes how the code box looks when we click inside it to type */
            outline: none;
            border-color: #d4a359;
        }



        .canvas-panel {  /* styles the right-hand area holding the spinning gear canvas */
            flex: 1;
            background: radial-gradient( circle, #221c2e 0%, #121018 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }


        canvas { /* styles the square drawing board where the gear spins */
            border: 2px solid #5a4221;
            background: #0d0b10;
            box-shadow: 0 0 20px rgba(212, 163, 89, 0.15);
        }
    </style>

    </head>


<body>


        <header>
            <h1>TinkerTick</h1>
            <span class="status">Status: <span class="status-ok">Ready</span></span>
                     </header>


                     <div class="workspace">
                        <div class="editor-panel">

                            <h3>Source Code</h3>
                            <p class="editor-hint">Paste TypeScript or JavaScript below to inspect its structure.</p>


                            <textarea class="code-input" spellcheck="false">function greet(<name:string) {
                                console.log('Hello, ${name}!');
                            } 
                           </textarea>
                        </div>


                        <div class="canvas-panel">


                            <!-- <canvas> creates a blank 500 x 500 pixel drawing board that JS can paint graphics into-->
                            <canvas id="engineCanvas" width="500" height="500"></canvas>
                        </div>
                    </div>



                    <!--JAVA SCRIPT CODE-->
                    <script>
                        const canvas = document.getElementById('engineCanvas');
                        const ctx = canvas.getContext('2d');   
                        let angle = 0; 


                        function drawGear(x, y, radius, teeth) {
                            const toothDepth = 10; // sets how tall each gear tooth sticks out (10 pixels)
                           
                           // 'Math.PI * 2' equals a full 360-degree circle in radians 
                           // Dividing by 'teeth' calculates the exact slice of the circle each tooth takes up
                            const step = (Math.PI*2) / teeth;


                            ctx.save(); 
                            ctx.translate(x, y);  
                            ctx.rotate(angle);  
                            ctx.strokeStyle = '#d4a359' ; 
                            ctx.lineWidth = 3;  


                            ctx.beginPath();  
                            for (let i = 0; i < teeth; i++) {
                                // calculates the four corner angles of each gear tooth
                                const a1 = i * step;
                                const a2 = a1 + step * 0.25;
                                const a3 = a1 + step * 0.5;
                                const a4 = a1 + step * 0.75;



                                // 'Math.cos()' and 'Math.sin()' convert those angles into exact X and Y pixel co-ordinates
                                // '.lineTo()' draws a straight line from the previous point to each new corner of the tooth
                                ctx.lineTo(Math.cos(a1) * radius, Math.sin(a1) * radius); 
                                ctx.lineTo(Math.cos(a2) * (radius + toothDepth), Math.sin(a2) * (radius + toothDepth)); 
                                ctx.lineTo(Math.cos(a3) * (radius + toothDepth), Math.sin(a3) * (radius + toothDepth));
                                ctx.lineTo(Math.cos(a4) * radius, Math.sin(a4) * radius); 
                            }


                            // '.closePath()' connects the last line back to the starting point so the gear loop is sealed.
                            // '.stroke()' actually inks the outlines on the screen so that we can see it.
                            ctx.closePath();
                            ctx.stroke();

                            
                            ctx.beginPath();
                            ctx.stroke();

                            ctx.beginPath();  
                            ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);  // draws a full circle in the middle that is 35% of the gear's size.
                            ctx.stroke(); 

                            ctx.restore(); // resets the canvas grid back to normal so future drawings aren't tilted
                        }



                        function render() { // outputs the visual UI of the canvas
                            ctx.clearRect(0, 0, canvas.width, canvas.height); // '.clearRect' prevents smearing by wiping the entire 500 x 500 canvas clean before drawing the next frame


                            // Sets the pen color and thickness for the large outer ring
                            ctx.strokeStyle = '#4a3820';
                            ctx.lineWidth= 4;

                            // Draws the static outer circular frame centered at (250, 250) with a radius of 180 pixels.
                            ctx.beginPath();
                            ctx.arc(250, 250, 180, 0, Math.PI * 2);  
                            ctx.stroke();

                            drawGear(250, 250, 80, 12);  

                            angle += 0.008;  
                            requestAnimationFrame(render);  // Tells the browser to run 'render' again on the very next screen refresh (60 times per second) so the gear spins smoothly. 
                        }

                        render(); 
                        </script>
                        </body>
                        </html>
