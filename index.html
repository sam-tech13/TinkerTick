<!DOCTYPE html>
<html lang= "en">

<head> 
    <meta charset= "UTF-8"> <!--Tells the web browser how to translate machine code into readable text for an HTML document-->

    <meta name= "viewport" content="width=device-width, initial-scale=1.0">
    <title>TinkerTick</title>


    <style>
        * { 
            box-sizing: border-box; 
        }



        body { 
            margin: 0;
            background-color: #121018;
            color: #e0d0b0;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }



        header {
            background: #1b1624;
            border-bottom: 2px solid #5a4221;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }



        h1 {  /* Styles the main 'TinkerTick' heading inside the header */ 
            margin: 0; 
            font-size: 1.15rem;
            font-weight: 600;
            color: #d4a359
        }


        .status {  /* Styles the 'Status: Ready' container on the right side of the header */
            font-size: 0.9rem;
            margin-right: 12px;
        }

        .status-ok {  /* Styles the word 'Ready' */
            color: #6bbe6b;
            font-weight: 600;
        }


        .status-error {  /* Styles the word 'Error' */
            color: #e05a5a;
            font-weight: 600;
        }


/* Styles for the Run and Build buttons in the header */

        .top-actions {   
            display: flex; 
            align-items: center;
        }

        .top-actions-button { 
            background: #221c2e;
            color: #d4a359;
            border: 1px solid #5a4221;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 8px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .top-actions button:hover {
            background: #5a4221;
            color: #fff;
        }
    

        .workspace {   /* Styles the main middle area below the header */
            display: flex; 
            flex: 1;
        }



        .editor-panel {  /* Styles the left panel where we type code*/
            width: 32%;
            background: #181522;
            border-right: 2px solid #3d2d18;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }


        .editor-panel h3 {  /* Styles the 'Source Code' sub-heading inside the left panel */
            margin: 0 0 6px;
            font-size: 1rem;
            color: #d4a359;
        }

        /* New Editor Tabs CSS */
        .editor-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            border-bottom: 1px solid #3d2d18;
            padding-bottom: 8px;
        }

        .tab,
        .tab-add { 
            background: #121018;
            color: #a09070; 
            border: 1px solid #3d2d18;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 0.8 rem;
            cursor: pointer;
        }

        .tab.active {
            background: #221c2e;
            color: #d4a359;
            border-color: #5a4221;
            font-weight: 600;
        }

        .tab-add:hover {
            color: #e0d0b0;
            border-color: #5a4221;
        }



        .code-input {   /* Styles the code where we paste the code */
            width: 100%;
            flex: 1;
            resize: none;
            background: #0f0d14;
            color: #e0d0b0;
            border: 1px solid #3d2d18;
            border-radius: 6px;
            padding: 12px; 
            font-family:'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }


        .code-input:focus {  /* changes how the code box looks when we click inside it to type */
            outline: none;
            border-color: #d4a359;
        }

        /* CSS for the Companion Panel */
        .companion-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding: 10px 12px;
            background: #15121c;
            border: 1px solid #3d2d18;
            border-radius: 8px;
        }

        .companion-avatar {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 2px solid #5a4221;
            background: #221c2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .companion-speech {
            flex: 1;
            background: #181522;
            border: 1px solid #5a4221;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            line-height: 1.4rem;
            color: #d4a359;
        }



        .center-column {  /* Stacks the gear canvas above the bottom overview cards */
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle, #221c2e 0%, #121018 100%);
        }

        .canvas-panel {  /* Centers the gear canvas inside the top area */
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        canvas { /* styles the square drawing board where the gear spins */
            border: 2px solid #5a4221;
            background: #0d0b10;
            box-shadow: 0 0 20px rgba(212, 163, 89, 0.15);
        }


        /* BOTTOM ROW OF CARDS FOR PROJECT OVERVIEW AND DIAGNOSTICS */
        .bottom-cards {
            height: 140px;
            display: flex; 
            gap: 12px;
            padding: 12px;
            background: #15121c;
            border-top: 2px solid #3d2d18;
        }

        .card {
            flex: 1;
            background: #181522;
            border: 1px solid #5a4221;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
        }

        .card-title {
            font-weight: 600;
            color: #d4a359;
        }

        .card-desc {
            color: #a09070; 
            margin: 6px 0;
        }

        .progress-track {
            background: #0f0d14;
            height: 8px;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill { 
            width: 92%;
            height: 100%;
            background: #6bbe6b;
            border-radius: 4px;
            transition: width 0.2s ease, background 0.2s ease;
        }

        .health-label {
            display: block;
            font-size: 0.75rem;
            color: #a09070;
            margin-top: 6px;
        }

        .diag-ok { 
            color: #6bbe6b;
            margin: 8px 0 0;
        }

        .diag-err {
            color: #e05a5a;
            margin: 8px 0 0;
        }



        /* Right-side Diagnostics panel */
        .metrics-panel {
            width: 240px;
            background: #181522;
            border-left: 2px solid #3d2d18;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .metrics-panel h3 {
            margin: 0 0 12px;
            font-size: rem;
            color: #d4a359;
        }

        .metric-card {
            background: #121018;
            border: 1px solid #5a4221;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #a09070;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d4a359;
            margin-top: 4px;
        }

        /* Style for the AST breakdown text */
        .ast-summary {
            font-size: 0.78rem;
            color: #a09070;
            margin-top: 6px;
            font-family: Consolas, 'Courier New', monospace;
        }


    </style>

    </head>




    <body>


        <header>
            <h1>TinkerTick</h1>
            <span class="status">Status: <span id="engineStatus" class="status-ok">Ready</span></span>
            <button type="button" id="runBtn">Run</button>
            <button type="button" id="buildBtn">Build</btn>
            <button type="button" id="formatBtn">Format</button>
                     </header>


                     <div class="workspace">
                        <div class="editor-panel"> 

                            <!-- File tabs at the top of the editor-->
                             <div class="editor-tabs">
                                <button type="button" class="tab active">main.js</button>
                                <button type="button" class="tab-add" id="addTabBtn">+</button>
                             </div>

                            <h3>Source Code</h3>

                            <textarea id="codeEditor" class="code-input" spellcheck="false">function greet(name)  {
                                console.log(`Hello, ${name}!`);
                            }
                            
                            
                            for (let i= 0; i < 5; i++) {   
                                greet("Inventor");   
                            }

                           </textarea>


                           <!-- COMPANION ASSIST BOX BELOW THE EDITOR-->
                            <div class="companion-panel">
                                <div class="companion-avatar">⚙️</div>
                                <div class="companion-speech" id="ineffaSpeech">Another invention? Let's make it extra special, hm? ✨ </div>
                            </div>
                        </div>

                        <!-- Canvas Engine + Bottom Overview Cards-->
                        <div class="center-column"> 
                        <div class="canvas-panel">


                            <!-- <canvas> creates a blank 420 x 420 pixel drawing board that JS can paint graphics into-->
                            <canvas id="engineCanvas" width="420" height="420"></canvas>
                        </div>   

                        <div class="bottom-cards">
                            <div class="card">
                                <div class="card-title">Project Overview</div>
                                <p class ="card-desc">AST distribution breakdown active</p>
                                <div class="progress-track">
                                    <div id="healthBar" class="progress-fill"></div>
                                </div>
                                <span class="health-label">Code Health: <span id="healthText" class="status-ok">92%</span></span>
                            </div>
                            

                            <div class="card">
                                <div class="card-title">Diagnostics</div>
                                <p id="diagnosticMsg" class="diag-ok">No syntax errors detected.</p>
                            </div>
                        </div>



                        <div class="metrics-panel">
                            <h3>Diagnostics</h3>

                            <div class="metric-card">
                                <div class="metric-label">Functions</div>
                                <div class="metric-value" id="functionCount">0</div>
                        </div>

                        <div class="metric-card">
                            <div class="metric-label">Loops</div>
                            <div class="metric-value" id="loopCount">0</div>
                            </div>

                            <div class="metric-card">
                                <div class="metric-label">Complexity</div>
                                <div class="metric-value" id="complexityScore">Low</div>
                            </div>

                            <div class="metric-card">
                                <div class="metric-label">Memory</div>
                                <div class="metric-value" id="memoryUsage">34%</div>
                            </div>

                            <div class="metric-card">
                                <div class="metric-label">AST Breakdown</div>
                                <div class="ast-summary" id="astSummary">Parsing tree...</div>
                            </div>
                        </div>
                     </div>



                    <!--JAVA SCRIPT CODE-->
                    <script>
                        const editor = document.getElementById('codeEditor');  // links to the <textarea id="codeEditor"> typing box
                        const funcCountEl = document.getElementById('functionCount'); // links to the <div id="funcCount"> number display 
                        const loopCountEl = document.getElementById('loopCount');  // links to the <div id="loopCount"> number display
                        const complexityScoreEl = document.getElementById('complexityScore');  // links to the <div id="complexityScore"> text display
                        const statusEl = document.getElementById ('engineStatus');  // links to the <span id="engineStatus"> status text

                        
                        // Links to the new Diagnostics text, Health Bar and Header Buttons respectively. 
                        const diagnosticMsg = document.getElementById('diagnosticMsg');
                        const healthBar = document.getElementById('healthBar');
                        const healthText = document.getElementById('healthText');
                        const runBtn = document.getElementById('runBtn');
                        const buildBtn = document.getElementById('buildBtn');

                        // Companion speech 
                        const ineffaSpeech = document.getElementById('ineffaSpeech');

                        // AST summary text and Format Button
                        const astSummary = document.getElementById('astSummary');
                        const formatBtn = document.getElementById('formatBtn');


                        const FUNC_TYPES = new Set ( [
                            'FunctionDeclaration',  // matches the standard functions like : function greet() {}
                            'FunctionExpression',   // matches functions assigned to variables like : const greet = function() {}
                            'ArrowFunctionExpression'   // matches arrow functions like : const greet = () => {}
                        ]);

                        const LOOP_TYPES = new Set ( [ 
                            'ForStatement',
                            'WhileStatement',
                            'DoWhileStatement'
                        ]);

                        const CLASS_TYPES = new Set ( [   // add class syntax types
                           'ClassDeclaration',
                           'ClassExpression' 
                        ]);
                        
                        // starting rotation speed and starting outline color of the gears
                        let gearSpeed = 0.012; 
                        let gearColor = '#d4a359';

                        function walkAst(node, counts) {   // counts how many times different parts of the code appear
                            if (!node || typeof node !== 'object') return;  // if 'node' is empty or not a JS object, stop running this function immediately

                            
                            // Sorts each node into functions, loops, classes or others
                            if (FUNC_TYPES.has(node.type)) {
                                counts.functions++;
                            } else if (LOOP_TYPES.has(node.type)) {
                                counts.loops++;
                            } else if (CLASS_TYPES.has(node.type)) {
                                counts.classes++;
                            } else {
                                counts.others++;
                            }

                            
                            for (const key of Object.keys(node)) {  // starts a loop that goes through that list of names one at a time, temporarily storing the current name in a variable called key
                                const child = node[key];  // uses that key name to look inside node and grab the actual value attached to it

                                if (Array.isArray(child)) {   // checks if a piece of data 'child' is a list of things rather than just a single thing
                                    child.forEach((item) => walkAst(item, counts));  // if it is a list, it inspects every item inside that list one by one
                                } else if 
                                (child && typeof child.type === 'string') {  // 'child' checks that the child item actually exists and is not empty and 'typeof child.type === 'string':' confirms that the 'child' has a type label written
                                    walkAst(child, counts);  // if both checks pass, the function steps down into that child item to explore its contents and update the counts tracker
                                }
                            }
                            }



                            function analyzeCode() {    
                                try {
                                    const ast = window.parser.parseCode(editor.value);  // sends the text from 'editor.value' to 'preload.js' so Acorn can parse it into a syntax tree (AST). 
                                    const counts = { functions: 0, loops: 0, classes: 0, others: 0 };  
                                    walkAst(ast, counts);  // passes the syntax tree and the 'counts' object into 'walkAst' to count all the functions and loops

                                    //updates the text on a webpage to show how many functions and loops were counted
                                    funcCountEl.textContent = counts.functions;
                                    loopCountEl.textContent = counts.loops;

                                    // Calculates the rounded whole-number percentage share for functions, loops, classes, and other code pieces
                                    const totalNodes = counts.functions + counts.loops + counts.classes + counts.others  || 1;
                                    const funcPct = Math.round((counts.functions / totalNodes) * 100);
                                    const loopPct = Math.round((counts.loops / totalNodes) * 100);
                                    const classPct = Math.round((counts.classes / totalNodes) * 100);
                                    const otherPct = Math.max(0, 100 - funcPct - loopPct - classPct);  // 'Math.max()' ensures otherPct never drops below 0 


                                    // Updates the AST Breakdown card text 
                                    astSummaryEl.textContent = `F: ${counts.functions} | L: ${counts.loops} | C: ${counts.classes} | O: ${counts.others}`;


                                    const total = counts.functions + counts.loops;  // Adds functions and loops together to determine the complexity label and rotation speed.
                                    if (total <= 2) {
                                        complexityScoreEl.textContent = 'Low';
                                        gearSpeed = 0.012;
                                    }

                                    else if (total <= 5) {
                                        complexityScoreEl.textContent = 'Medium';
                                        gearSpeed = 0.03;
                                    }  

                                    else {
                                        complexityScoreEl.textContent = 'High';
                                        gearSpeed = 0.55;
                                    }


                                    statusEl.textContent = 'Ready';
                                    statusEl.className = 'status-ok';
                                    gearColor = '#d4a359';


                                    // Updates the bottom Diagnostics card and Health Bar when code is valid 
                                    diagnosticMsg.textContent = 'No syntax errors detected.';
                                    diagnosticMsg.className = 'diag-ok';
                                    healthBar.style.width = '92%';
                                    healthBar.style.background = '#6bbe6b';
                                    healthText.textContent = '92%';
                                    healthText.className = 'status-ok';

                                ineffaSpeech.textContent = 'A wonderful build! The clockwork is humming smoothly. 💖'; 
                                } 


                                catch  (err) {
                                    
                                    // Runs when 'parseCode' fails due to syntax error in the user's code.
                                    statusEl.textContent = 'Syntax Error';
                                    statusEl.className = 'status-err';
                                    gearSpeed = 0;
                                    gearColor = '#e05a5a';


                                // Shows the exact Acorn error message and drops the health bar to 30%
                                const cleanError = err.message.split(' (')[0];
                                diagnosticMsg.textContent = `Syntax Error: ${cleanError}`;
                                diagnosticMsg.className = 'diag-err';
                                healthBar.style.width = '30%';
                                healthBar.style.background = '#e05a5a';
                                healthText.textContent = '30%';
                                healthText.className = 'status-err';

                                ineffaSpeech.textContent = "Oops! A mechanical jam in the code! Let's check that syntax. ⚠️";
                                }
                            }


                            editor.addEventListener('input', analyzeCode);
                            analyzeCode();

                            // Connects the Run and Build buttons without using inline onclick attributes
                            runBtn.addEventListener('click', () => { 
                                analyzeCode();
                                diagnosticMsg.textContent = 'Test run completed.' ;
                                diagnosticMsg.className = 'diag-ok';
                            });


                            buildBtn.addEventListener('click', () => {
                                diagnosticMsg.textContent = 'Build package created.';
                                diagnosticMsg.className = 'diag-ok';
                            }); 


                        // Formats code indentation cleanly when Format is clicked 
                        formatBtn.addEventListener('click', () => { 
                            try {
                                window.parser.parseCode(editor.value);

                                let indent = 0;
                                const formatted = editor.value
                                  .split('\n')  // chops the entire text block into an array of individual lines wherever a line break occurs.
                                  .map((line) => line.trim())  // visits every line in the list and removes all extra spaces at the start and the end.
                                  .filter(Boolean)  
                                  .map((line) => { 
                                    if (line.startsWith('}'))indent = Math.max(0, indent -1);
                                    const spacedLine = '   '.repeat(indent) + line;
                                    if (line.endsWith('{')) indent++;
                                    return spacedLine;
                                  })
                                  .join('\n'); // glues all the spaced lines back together into one text block separated by line breaks.


                                editor.value = formatted;
                                analyzeCode();

                                // Updates the Diagnostics card when code is formatted.
                                diagnosticMsg.textContent = 'Code formatted.';
                                diagnosticMsg.className = 'diag-ok';

                                // Updates the companion speech bubble text.
                                ineffaSpeech.textContent = 'Clean and aligned. Every gear is in place.';
                                 }

                                 catch { 
                                    diagnosticMsg.textContent = 'Cannot format code with syntax errors.';
                                    diagnosticMsg.className = 'diag-err';
                                 }
                                });



                        const canvas = document.getElementById('engineCanvas');
                        const ctx = canvas.getContext('2d');   
                        let angle = 0;


                        function drawGear(x, y, radius, teeth, rotation) {
                            const toothDepth = 10; // sets how tall each gear tooth sticks out (10 pixels)
                           
                           // 'Math.PI * 2' equals a full 360-degree circle in radians 
                           // Dividing by 'teeth' calculates the exact slice of the circle each tooth takes up
                            const step = (Math.PI*2) / teeth;


                            ctx.save(); 
                            ctx.translate(x, y);  
                            ctx.rotate(rotation);
                            ctx.strokeStyle = gearColor ; 
                            ctx.lineWidth = 3;  


                            ctx.beginPath();  
                            for (let i = 0; i < teeth; i++) {
                                // calculates the four corner angles of each gear tooth
                                const a1 = i * step;
                                const a2 = a1 + step * 0.25;
                                const a3 = a1 + step * 0.5;
                                const a4 = a1 + step * 0.75;



                                // 'Math.cos()' and 'Math.sin()' convert those angles into exact X and Y pixel co-ordinates
                                // '.lineTo()' draws a straight line from the previous point to each new corner of the tooth
                                ctx.lineTo(Math.cos(a1) * radius, Math.sin(a1) * radius); 
                                ctx.lineTo(Math.cos(a2) * (radius + toothDepth), Math.sin(a2) * (radius + toothDepth)); 
                                ctx.lineTo(Math.cos(a3) * (radius + toothDepth), Math.sin(a3) * (radius + toothDepth));
                                ctx.lineTo(Math.cos(a4) * radius, Math.sin(a4) * radius); 
                            }


                            // '.closePath()' connects the last line back to the starting point so the gear loop is sealed.
                            // '.stroke()' actually inks the outlines on the screen so that we can see it.
                            ctx.closePath();
                            ctx.stroke();

                            
                            ctx.beginPath();
                            ctx.stroke();

                            ctx.beginPath();  
                            ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);  // draws a full circle in the middle that is 35% of the gear's size.
                            ctx.stroke(); 

                            ctx.restore(); // resets the canvas grid back to normal so future drawings aren't tilted
                        }



                        function render() { // outputs the visual UI of the canvas
                            ctx.clearRect(0, 0, canvas.width, canvas.height); // '.clearRect' prevents smearing by wiping the entire 500 x 500 canvas clean before drawing the next frame

   
                            // ( Adjusted the co-ordinates to fit the smaller 420 X 420 canvas)

                            // Sets the pen color and thickness for the large outer ring
                            ctx.strokeStyle = '#4a3820';
                            ctx.lineWidth= 5;

                            // Draws the static outer circular frame centered at (210, 210) with a radius of 180 pixels.
                            ctx.beginPath();
                            ctx.arc(210, 210, 160, 0, Math.PI * 2);  
                            ctx.stroke();

                            drawGear(210, 210, 70, 14, angle);
                            drawGear(295, 150, 30, 8, -angle * 1.8);

                            angle += gearSpeed;
                            requestAnimationFrame(render);  // Tells the browser to run 'render' again on the very next screen refresh (60 times per second) so the gear spins smoothly. 
                        }

                        render(); 
                        </script>
                        </body>
                        </html>
